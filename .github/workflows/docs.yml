# Documentation website (MkDocs + Material) -> GitHub Pages. See docs/website.md.
#
# ONE-TIME SETUP (repo admin): Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Without it the deploy job fails; pull requests only build.
name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "tools/build_site.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/build_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install -r site/requirements.txt
      - run: python tools/build_site.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
