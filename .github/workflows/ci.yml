name: ci

# push: only main (a PR branch is tested by its pull_request event, not twice).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # nightly full run on main: the safety net for the change filter below
  schedule:
    - cron: "17 3 * * *"

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this change needs (tools/ci_changes.py): docs-only changes skip the build and the test jobs,
  # the std mutants run only for the std modules whose source or tests changed. A push to main, the nightly
  # run and a manual run select everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      macos: ${{ steps.f.outputs.macos }}
      vscode: ${{ steps.f.outputs.vscode }}
      mutants: ${{ steps.f.outputs.mutants }}
      mutant_jobs: ${{ steps.f.outputs.mutant_jobs }}
      std_backend_checks: ${{ steps.f.outputs.std_backend_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rules self-test
        run: python3 tools/ci_changes.py --selftest
      - name: Changelog fragments (changes/*.md)
        run: python3 tools/changelog.py --selftest && python3 tools/changelog.py --check
      - id: f
        name: Select jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/ci_changes.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi

  # Seed bootstrap once; the later jobs reuse the compiler (build/bootstrap) as an artifact.
  # Compiler cache (docs/testing.md): a pull request whose compiler inputs (the key below: the compiler, every source it
  # embeds, the runtime, the platform layer, the seed and the bootstrap scripts) equal those of an earlier passed
  # bootstrap reuses that bootstrap's orin2 and stage2.c and skips the bootstrap. An entry is only written after the full
  # bootstrap (fixed point stage2.c == stage3.c, conformance) passed. A push to main, the nightly run and a manual run
  # never read the cache: they always bootstrap from the seed (and refresh the entry), so a cache can never hide a broken
  # fixed point on main.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache key (hash of the compiler inputs)
        run: echo "ORIN_CACHE_KEY=orin2-${{ runner.os }}-${{ hashFiles('compiler/**', 'library/core/**', 'library/collections/**', 'library/std/**', 'runtime/**', 'bootstrap/seed/**', 'tools/bootstrap.sh', 'tools/cc_split.sh', 'tools/embed_prelude.py') }}" >> "$GITHUB_ENV"
      - name: Restore the compiler from the cache (pull requests only)
        id: cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.ORIN_CACHE_KEY }}
          path: |
            build/bootstrap/orin2
            build/bootstrap/stage2.c
      - name: Seed bootstrap (seed -> orin0 -> orin1 -> orin2 -> stage3, compare, conformance)
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/bootstrap.sh
      # On a hit the bootstrap's conformance run (tests/run + tests/errors with orin2) is covered by the sanitize job
      # (the same tests with the same compiler, all suites, the executables under ASan + UBSan), llvm and contracts.
      - name: Cached compiler (inputs equal those of a passed bootstrap)
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          python3 tools/embed_prelude.py --check
          echo "orin2 and stage2.c restored from the cache entry $ORIN_CACHE_KEY: bootstrap skipped"
      - name: Save the compiler to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true  # an entry with this key may exist already (written by a concurrent run)
        uses: actions/cache/save@v4
        with:
          key: ${{ env.ORIN_CACHE_KEY }}
          path: |
            build/bootstrap/orin2
            build/bootstrap/stage2.c
      - name: Pack compiler
        run: tar -czf bootstrap.tgz build/bootstrap/orin2 build/bootstrap/stage2.c
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: bootstrap.tgz
          retention-days: 3

  sanitize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Conformance tests with self-hosted compiler (ASan + UBSan)
        run: tools/conformance.sh --orinc build/bootstrap/orin2 --suite all --sanitize

  llvm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: LLVM IR backend (conformance, all suites; clang is preinstalled on ubuntu-latest)
        run: tools/conformance.sh --orinc build/bootstrap/orin2 --suite all --backend llvm
      - name: C backend vs LLVM backend (differential)
        run: tools/differential.sh --mode llvm
      - name: LLVM fixed point (ADR-0038 gate 2; the LLVM-built compiler emits the same C and the same .ll as orin2)
        run: sh tools/llvm_fixpoint.sh
      - name: Pinned LLVM toolchain (ADR-0038 section 8, gate 3; pin shape, checksum-verified install of a local fake archive)
        run: sh tools/test_llvm_toolchain.sh

  # ADR-0055: the wasm64-orbit target. The conformance suites run as WebAssembly modules under Node 24 (memory64, table64)
  # with tools/wasm_run.mjs, plus the differential tests and the size budget of the WebAssembly L0.
  wasm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: wasm-ld (lld) for the preinstalled clang
        run: |
          command -v wasm-ld || { sudo apt-get update -qq && sudo apt-get install -y -qq lld; }
          command -v wasm-ld || sudo ln -s "$(ls /usr/bin/wasm-ld-* | sort -V | tail -1)" /usr/local/bin/wasm-ld
          clang --version && wasm-ld --version
      - name: wasm64-orbit (float and builtins differential, conformance as modules, L0 budget)
        run: tools/test_wasm.sh --orinc build/bootstrap/orin2

  # ADR-0047 section 3: the Orin conformance runner (tooling/conformance) is what the jobs use; tools/run_tests.py is the
  # independent Python oracle. This job runs both over the real suites (C and LLVM) and over a tree of deliberately
  # broken tests and requires identical output, so the two cannot drift and the self-hosted toolchain is not its only judge.
  conformance-parity:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Conformance runner unit tests
        run: tools/conformance.sh --unit-tests
      - name: Build the Orin runner
        run: tools/conformance.sh --build-only
      - name: Python oracle vs Orin runner (real suites, broken fixtures, command line)
        run: python3 tools/check_conformance_parity.py --backends c,llvm

  backends:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Differential harness unit tests (tooling/differential)
        run: tools/differential.sh --unit-tests
      - name: Optimised MIR vs --no-opt (differential)
        run: tools/differential.sh --mode opt
      - name: Std prelude (Orin) vs C runtime built-ins (spec 19 R1)
        run: tools/differential.sh --mode builtins
      - name: Release packaging smoke test
        run: ./tools/package.sh 0.0.0-ci linux-x86_64
      - name: install.sh and orin doctor against the package
        run: ./tools/test_install.sh build/dist/orin-0.0.0-ci-linux-x86_64.tar.gz
      - name: Packages (orin.toml, module rules, orin check --deps, orin api, launcher)
        run: ./tools/test_packages.sh

  # the fuse differential is the slowest part of the old backends job (about 12 minutes), so it runs as 3 shards
  # (tools/differential.sh --shard I/N: every N-th program from the I-th; the shards together run each program once)
  backends-fuse:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: "Fused array pipelines vs --no-fuse (differential, ADR-0038 §2): shard ${{ matrix.shard }}"
        run: tools/differential.sh --mode fuse --shard ${{ matrix.shard }}

  # ADR-0015: the compiler built with --check-contracts (its own @Requires/@Ensures/@Invariant clauses
  # become traps) self-compiles to the identical stage2.c and passes all suites.
  contracts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Compiler built with --check-contracts - self-compile identical to stage2.c, all suites
        run: tools/test_compiler_contracts.sh
      - name: Contract strength (mutation) tool - smoke run on the demo (ADR-0028)
        run: python3 tools/contract_mutation.py examples/contract_mutation.or --orinc build/bootstrap/orin2 --max-mutants 6 --min-kill-rate 0.3

  tooling:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Formatter (goldens, idempotence, AST + comment preservation, JSON diagnostics)
        run: tools/clitests.sh fmt
      - run: python3 tools/test_threads.py
      - name: Split C (compile --split N - single-file identity, same output as the single-file build, self-build)
        run: tools/test_split.sh --self
      - name: Tooling unit tests (JSON, analysis, LSP)
        run: ./tools/test_tooling.sh
      - name: Release CLI project and terminal journeys
        env:
          ORIN2: build/bootstrap/orin2
        run: python3 tools/test_cli.py
      # --orin orin2: orin2 is the current compiler/ built by orin1, and its self-compile is byte-identical (the fixed
      # point), so the tests no longer build the same compiler again (once each, about a minute)
      - name: Protocol harness unit tests (tooling/protocol)
        run: tools/protocol.sh --unit-tests
      - name: CLI tests harness unit tests (tooling/clitests)
        run: tools/clitests.sh --unit-tests
      - name: Language server end to end (orin lsp over stdio)
        run: tools/protocol.sh lsp --orin build/bootstrap/orin2
      - name: MCP server end to end (orin mcp over stdio)
        run: tools/protocol.sh mcp --orin build/bootstrap/orin2
      - name: OSIG (orin graph / orin diff - golden, determinism, evidence classes, rename + signature change + new call path)
        run: tools/clitests.sh osig --orin build/bootstrap/orin2
      - name: Companion modules and orin expand (ADR-0046 S4 - goldens, std:meta codec, determinism)
        run: python3 tools/test_expand.py --orinc build/bootstrap/orin2
      - name: Annotation processors (ADR-0046 S5 - end to end on C and LLVM, E0448, E0520 limits, cache, W0490, trust policy)
        run: python3 tools/test_processors.py --orinc build/bootstrap/orin2
      - name: Effects (orin effects, MAY_PERFORM edges, diff effect sections, [effects] policy; ADR-0037 D2)
        run: python3 tools/test_effects.py --orin build/bootstrap/orin2
      - name: OSIG diff report of the pull request (report only, never fails the build)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LINK_BASE: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/compiler
        run: |
          mkdir -p build/osig
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add build/osig/base "$BASE_SHA"
          build/bootstrap/orin2 diff --base build/osig/base/compiler/main.or --head compiler/main.or \
            --format=html --link-base "$LINK_BASE" -o build/osig/osig-diff.html
          build/bootstrap/orin2 diff --base build/osig/base/compiler/main.or --head compiler/main.or \
            -o build/osig/osig-diff.txt
          { echo '### OSIG diff of compiler/ (report only; full report in the osig-diff-report artifact)'; echo '```'; head -60 build/osig/osig-diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload OSIG diff report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: osig-diff-report
          path: |
            build/osig/osig-diff.html
            build/osig/osig-diff.txt
          if-no-files-found: ignore

  # The run record of this commit (ADR-0050 step 3, schema orin-runs/0.1): per-phase compile times of the compiler compiling itself and
  # of two programs (orin compile --timings), and the outcome of the tooling job. One record per run, uploaded as an artifact; a
  # history is a directory of such records, read by `explore --runs`. Nothing is stored across runs.
  run-record:
    needs: [build, tooling]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Run record
        env:
          TOOLING_RESULT: ${{ needs.tooling.result }}
        run: |
          python3 tools/run_record.py --orinc build/bootstrap/orin2 --commit "$GITHUB_SHA" \
            --out "build/runs/$GITHUB_SHA.json" --suite "tooling=${TOOLING_RESULT}"
          cat "build/runs/$GITHUB_SHA.json"
      - name: Upload run record
        uses: actions/upload-artifact@v4
        with:
          name: run-record
          path: build/runs/*.json

  assurance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Runtime unit tests incl. shape-confusion traps (ASan + UBSan, finding F-shape)
        run: |
          mkdir -p build
          stub=$(tools/rt_stub.sh build/rt_stub_asan.o -g -fsanitize=address,undefined -fno-sanitize-recover=undefined)
          cc -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -I runtime/core runtime/core/tests/runtime_test.c runtime/core/orin_runtime.c runtime/platform/orin_platform.c $stub -lm -o build/runtime_test
          build/runtime_test
      - name: Mutation corpus (injected ownership bugs must be rejected by the verifier, docs/assurance.md P0)
        run: python3 tools/mutate_mir.py
      - name: Memory-safety claims (docs/memory-safety.md cites only ledger claims, ADR-0053 M2)
        run: |
          python3 tools/check_safety_claims.py --selftest
          python3 tools/check_safety_claims.py
      - name: Contract erasure (generated C and LLVM IR identical with and without contract clauses)
        run: python3 tools/test_contract_erasure.py --orinc build/bootstrap/orin2
      - name: "@Test erasure (generated C and LLVM IR identical with and without @Test functions)"
        run: python3 tools/test_annotation_erasure.py --orinc build/bootstrap/orin2
      - name: Built-in annotations end to end (orin test, @Deprecated warnings, api snapshot, @Inline in both backends)
        run: python3 tools/test_annotations.py --orinc build/bootstrap/orin2
      - name: Contract verification (orin verify --contracts with z3)
        run: |
          pip install z3-solver
          python3 tools/test_verify_contracts.py --require-z3
      - name: Tutorial (docs/tutorial - every example builds, runs and prints the documented output; code blocks match their files; z3 is installed above)
        run: tools/test_tutorial.sh build/bootstrap/orin2
      - name: Example projects (examples/projects - build, unit tests, wc fixtures, notes-service over HTTP)
        run: python3 tools/test_example_projects.py --orinc build/bootstrap/orin2
      - name: Platform boundary (no direct libc in runtime/), seed runtime snapshot symbols and L0 platform layer (tests, size budget, CBMC)
        run: |
          sudo apt-get install -y cbmc
          tools/check_platform_boundary.sh
          tools/check_seed_runtime.sh
          REQUIRE_CBMC=1 tools/verify_platform.sh

  concurrency:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: "Concurrency stage 0 (ADR-0017): runtime task tests and stress tests, plain, ThreadSanitizer, AddressSanitizer + UBSan"
        run: tools/test_concurrency.sh
      - name: "Server acceptance campaign (C5): 1 / 64 / 1,024 clients, slowloris, non-reading peers, cancellation storms, graceful shutdown, C/LLVM parity, TSan, ASan+UBSan"
        timeout-minutes: 10
        run: |
          python3 --version && clang --version
          tools/test_server_campaign.sh

  std:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: "Provable std (std:bytes, std:utf8, std:collections, std:http, std:task: tests with and without contract checking)"
        run: tools/test_std.sh

  # New std modules already have C @Test coverage; their independent oracles/backend harnesses
  # run only when selected. Ubuntu's runner supplies clang; Python 3.12 is pinned explicitly.
  std-backends:
    needs: [changes, build]
    if: needs.changes.outputs.std_backend_checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.std_backend_checks != '[]'
        with:
          python-version: '3.12'
      - name: Check targeted std runner tools
        if: needs.changes.outputs.std_backend_checks != '[]'
        run: python3 --version && clang --version
      - name: Encoding vectors, Python oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'encoding')
        timeout-minutes: 8
        run: python3 tools/check_encoding.py --orinc build/bootstrap/orin2 --skip-bench
      - name: JSON-number vectors, Python oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'jsonnumber')
        timeout-minutes: 8
        run: python3 tools/check_jsonnumber.py --orinc build/bootstrap/orin2 --skip-bench
      - name: JSON-value tree/token oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'jsonvalue')
        timeout-minutes: 8
        run: python3 tools/check_jsonvalue.py --orinc build/bootstrap/orin2 --skip-bench
      - name: JSON-decoder structural/path oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'jsondecode')
        timeout-minutes: 8
        run: python3 tools/check_jsondecode.py --orinc build/bootstrap/orin2 --skip-bench
      - name: URL vectors and round trips, C/LLVM contracts on/off
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'url')
        timeout-minutes: 8
        run: python3 bench/url/check.py --orin build/bootstrap/orin2 --skip-bench

  std-mutants:
    needs: [changes, build]
    if: needs.changes.outputs.mutants != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # one entry per {module, shard}: the slow http mutants are split over several jobs (tools/ci_changes.py SHARDS);
      # the shards of a module together run every one of its mutants
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mutant_jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      # tooling/mutation is an Orin package (ADR-0047 phase 5); tools/mutation.sh builds it with the bootstrapped compiler
      - name: Mutation tool unit tests
        run: tools/mutation.sh --unit-tests
      - name: "Provable std mutation check (every deliberately broken implementation must fail): ${{ matrix.module }} ${{ matrix.shard }}"
        run: tools/mutation.sh std --orinc build/bootstrap/orin2 --module ${{ matrix.module }} --shard ${{ matrix.shard }}

  vscode:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grammar tests
        working-directory: editors/vscode
        run: npm ci && npm test

  formal:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Check formal model (no sorry, standard axioms only)
        working-directory: formal
        run: ./check.sh
      - name: Differential test, Lean checker vs compiler/verify (docs/assurance.md C4)
        run: |
          (cd formal && lake build orin_check)
          CFLAGS="-O0 -w" ./tools/bootstrap.sh --seed-only
          python3 tools/diff_verifier_lean.py --orinc build/bootstrap/orin0

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap on macOS arm64 (clang, BSD userland)
        run: ./tools/bootstrap.sh
      - name: Monotonic clock failure, grant and C/LLVM regression checks
        timeout-minutes: 10
        run: python3 tools/test_time.py --orinc build/bootstrap/orin2
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.std_backend_checks != '[]'
        with:
          python-version: '3.12'
      - name: Check targeted std runner tools
        if: needs.changes.outputs.std_backend_checks != '[]'
        run: python3 --version && clang --version
      - name: Encoding vectors, Python oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'encoding')
        timeout-minutes: 8
        run: python3 tools/check_encoding.py --orinc build/bootstrap/orin2 --skip-bench
      - name: JSON-number vectors, Python oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'jsonnumber')
        timeout-minutes: 8
        run: python3 tools/check_jsonnumber.py --orinc build/bootstrap/orin2 --skip-bench
      - name: JSON-value tree/token oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'jsonvalue')
        timeout-minutes: 8
        run: python3 tools/check_jsonvalue.py --orinc build/bootstrap/orin2 --skip-bench
      - name: JSON-decoder structural/path oracle, C/LLVM contracts on/off and C sanitizers
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'jsondecode')
        timeout-minutes: 8
        run: python3 tools/check_jsondecode.py --orinc build/bootstrap/orin2 --skip-bench
      - name: URL vectors and round trips, C/LLVM contracts on/off
        if: contains(fromJSON(needs.changes.outputs.std_backend_checks), 'url')
        timeout-minutes: 8
        run: python3 bench/url/check.py --orin build/bootstrap/orin2 --skip-bench
      - name: Release CLI journeys on macOS
        env:
          ORIN2: build/bootstrap/orin2
        run: python3 tools/test_cli.py
      - name: Portable execution deadlines (native, C/LLVM, CLI and MCP)
        run: python3 tools/test_execution.py
      - name: All suites with the self-hosted compiler
        run: tools/conformance.sh --orinc build/bootstrap/orin2 --suite all
      - name: std:net on the loopback (HTTP server example, slowloris timeout, scope refusals, ORIN_DENY=net)
        run: sh tools/test_net.sh
      - name: "Server acceptance campaign (quick: 64 clients, hostile peers, storms, shutdown; no sanitizers)"
        timeout-minutes: 6
        run: tools/test_server_campaign.sh --quick
