name: test

# Installs the formula from this checkout on macOS (Apple silicon, Intel) and Linux x86-64 and runs its test block (see the formula),
# then uninstalls. Runs on every PR (the release workflow's formula updates) and push.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew on PATH (Linux runners ship it outside PATH)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Tap this checkout
        run: |
          brew untap orin-lang/orin 2>/dev/null || true
          brew tap orin-lang/orin "$GITHUB_WORKSPACE"
      - name: Style
        run: brew style orin-lang/orin/orin
      - name: Install (downloads the release and checks its sha256)
        run: brew install --formula orin-lang/orin/orin
      - name: Test block
        run: brew test orin-lang/orin/orin
      - name: Smoke test outside the test sandbox
        run: |
          orin --version
      - name: Uninstall
        run: |
          brew uninstall --formula orin
          ! command -v orin
