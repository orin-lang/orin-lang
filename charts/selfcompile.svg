<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Self-compile (orin2 compiles compiler/main.or) over time</title><desc id="desc">Two panels: executed instructions (the regression metric) and wall-time median in seconds, for every run on main.</desc>
