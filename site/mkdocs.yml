# Generated-site configuration. Do not run mkdocs directly: use `python3 tools/build_site.py`,
# which stages the selected docs/ files into build/site-src and then runs mkdocs against a copy of this file in build/ (so docs_dir and site_dir are relative to build/).
site_name: Orin
site_description: Documentation for the Orin programming language
site_url: https://orin-lang.github.io/orin-lang/
repo_url: https://github.com/orin-lang/orin-lang
repo_name: orin-lang/orin-lang
docs_dir: site-src
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences

# `nav:` is appended by tools/build_site.py (generated from the staged file list).
